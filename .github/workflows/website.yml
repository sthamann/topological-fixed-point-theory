name: Website Build

# The public mirror (website/, Next.js). A green build here means the site
# compiles from the same source that the sync audit keeps byte-identical.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "semantic_explorer/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "semantic_explorer/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check published Atlas inventory and shared evidence links
        run: |
          python3 scripts/build-research-inventory.py --check
          python3 -m unittest discover -s scripts -p 'test_research_inventory.py'

      - name: Production build
        run: npm run build


  atlas:
    name: Atlas response and freshness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path semantic_explorer/server/Cargo.toml
